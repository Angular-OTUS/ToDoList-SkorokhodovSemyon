<li
  class="task-item"
  (dblclick)="enableEditMode()"
  appTooltip="{{'TASK.EDIT_HINT' | translate}}"
  #itemTip="appTooltip"
>
  @if (isEditing()) {
    <div class="task-item__edit-mode" (click)="$event.stopPropagation()">
      <mat-form-field appearance="outline" class="task-item__input">
        <input
          matInput
          #titleInput
          [ngModel]="editedTitle()"
          (ngModelChange)="editedTitle.set($event)"
          (keydown.enter.prevent)="saveTitle()"
          (keydown.escape.prevent)="cancelEdit()"
        />
      </mat-form-field>

      <div class="task-item__actions">
        <app-button
          [typeButton]="'add'"
          (click.stop)="saveTitle()"
        >{{'TASK.SAVE' | translate}}
        </app-button>

        <app-button
          [typeButton]="'delete'"
          (click.stop)="cancelEdit()"
        >{{'TASK.CANCEL' | translate}}
        </app-button>
      </div>
    </div>
  } @else {
    <mat-checkbox
      [checked]="item().status === 'Completed'"
      (change)="toggleStatus()"
      (click)="$event.stopPropagation()"
      color="primary"
    ></mat-checkbox>
    <span class="task-item__text">{{ item().title }}</span>
    <app-button
      appTooltip="{{'TASK.DELETE_TITLE' | translate}} {{ item().title }}"
      [typeButton]="'delete'"
      (click.stop)="removeTodo()"
      (mouseenter)="itemTip.hide()"
      (mouseleave)="itemTip.show()"
    >{{'TASK.DELETE' | translate}}
    </app-button>
  }
</li>
